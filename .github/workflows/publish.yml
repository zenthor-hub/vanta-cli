name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Validate tag version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(bun -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match package.json version ($VERSION)."
            exit 1
          fi

      # Pack once and smoke-test the exact tarball that gets published.
      - name: Build package artifact
        run: |
          mkdir -p package
          bun pm pack --ignore-scripts --filename package/vanta-cli.tgz
          bun scripts/check-package.ts package/vanta-cli.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/vanta-cli.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm for OIDC trusted publishing
        run: npm install -g npm@11.6.2

      - name: Download verified package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package

      - name: Publish
        run: |
          if [[ ! -f ./package/vanta-cli.tgz ]]; then
            echo "::error::Publish tarball is missing: ./package/vanta-cli.tgz"
            exit 1
          fi
          npm publish ./package/vanta-cli.tgz --access public --provenance
